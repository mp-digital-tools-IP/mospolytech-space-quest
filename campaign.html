<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0b10">
<title>Московский Политех — Полный маршрут</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a0b10;font-family:Arial,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#fff}
body{display:flex;flex-direction:column;overscroll-behavior:none}
.top{height:48px;min-height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;background:#0e1016;border-bottom:1px solid #2e333d;z-index:5}
.home{height:34px;min-width:78px;padding:0 11px;border:1px solid #4a515e;border-radius:9px;background:#171a22;color:#fff;font-size:11px;font-weight:800;text-decoration:none;display:flex;align-items:center;justify-content:center}
.progress{flex:1;min-width:0}.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#aab0b9;font-weight:700;letter-spacing:.04em}.progress-top b{color:#fff}.bar{height:4px;background:#2b3039;border-radius:999px;margin-top:5px;overflow:hidden}.fill{height:100%;background:#e51d2a;width:25%;transition:width .25s ease}
.logo{width:145px;height:auto;background:#fff;border-radius:6px;padding:4px 7px}
.framewrap{flex:1;min-height:0;position:relative;background:#070911}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#070911}
.transition{position:absolute;inset:0;z-index:20;background:rgba(4,5,10,.95);display:none;align-items:center;justify-content:center;padding:22px}.transition.active{display:flex}
.box{width:560px;max-width:94%;text-align:center;background:#11141d;border:1px solid #404651;border-radius:18px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.check{width:78px;height:78px;border-radius:22px;background:#178b4b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:39px;font-weight:900;margin:0 auto 14px}.kicker{color:#e51d2a;text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:800}.box h1{font-size:30px;line-height:1.02;margin:8px 0 10px}.box p{color:#c8cdd4;font-size:14px;line-height:1.42;margin:0 0 15px}.next{min-height:52px;border:0;border-radius:11px;background:#e51d2a;color:#fff;font-weight:900;font-size:15px;padding:0 22px}.sub{font-size:10px;color:#858c96;margin-top:10px}
@media(max-width:600px){.top{height:44px;min-height:44px;padding:0 8px;gap:8px}.logo{display:none}.home{min-width:64px;height:32px;font-size:10px}.progress-top{font-size:9px}.box{padding:20px}.box h1{font-size:26px}}
</style>
</head>
<body>
<header class="top">
  <a class="home" href="./">← МИССИИ</a>
  <div class="progress">
    <div class="progress-top"><b id="mission-label">МИССИЯ 1 ИЗ 4</b><span id="mission-name">Орбитальная стыковка</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
  </div>
  <img class="logo" src="assets/polytech_logo_main_RGB_RUS.png" alt="Московский Политех">
</header>
<div class="framewrap">
  <iframe id="game" title="Космическая миссия" scrolling="no" allow="autoplay"></iframe>
  <div class="transition" id="transition">
    <div class="box">
      <div class="check">✓</div>
      <div class="kicker" id="done-kicker">Миссия 1 из 4 выполнена</div>
      <h1 id="done-title">Орбитальная стыковка</h1>
      <p id="done-detail">Результат зафиксирован. Переходим к следующей инженерной задаче.</p>
      <button class="next" id="next-btn" type="button">СЛЕДУЮЩАЯ МИССИЯ</button>
      <div class="sub" id="auto-note">Автопереход через 4 секунды</div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var MISSIONS=[
 {id:'docking',name:'Орбитальная стыковка',url:'missions/docking/',overlay:'message-overlay',title:'msg-title',detail:'msg-detail',success:'СТЫКОВКА ВЫПОЛНЕНА'},
 {id:'landing',name:'Мягкая посадка',url:'missions/landing/',overlay:'result-overlay',title:'result-title',detail:'result-text',success:'Мягкая посадка выполнена'},
 {id:'orbit',name:'Вывод на орбиту',url:'missions/orbit/',overlay:'result-overlay',title:'result-title',detail:'result-text',success:'Орбита стабилизирована'},
 {id:'debris',name:'Очистка орбиты',url:'missions/debris/',overlay:'result-overlay',title:'result-title',detail:'result-text',success:'Орбитальный сектор очищен'}
];
function param(name){var m=new RegExp('[?&]'+name+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):null}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function safeRead(){try{return JSON.parse(sessionStorage.getItem('mp_space_campaign')||'null')}catch(e){return null}}
function safeWrite(v){try{sessionStorage.setItem('mp_space_campaign',JSON.stringify(v))}catch(e){}}
var step=clamp(parseInt(param('step')||'0',10)||0,0,3);
var game=document.getElementById('game'),transition=document.getElementById('transition');
var current=MISSIONS[step],completeHandled=false,autoTimer=null,pollTimer=null,missionStarted=Date.now();
var state=safeRead();
if(!state||step===0){state={startedAt:Date.now(),results:{}};safeWrite(state)}
function updateTop(){document.getElementById('mission-label').innerHTML='МИССИЯ '+(step+1)+' ИЗ 4';document.getElementById('mission-name').innerHTML=current.name;document.getElementById('fill').style.width=((step+1)*25)+'%'}
function load(){updateTop();game.src=current.url;completeHandled=false;missionStarted=Date.now();if(pollTimer)clearInterval(pollTimer);pollTimer=setInterval(checkSuccess,350)}
function visible(doc,id){var el=doc.getElementById(id);if(!el)return false;var cs=doc.defaultView.getComputedStyle(el);return cs.display!=='none'&&cs.visibility!=='hidden'&&parseFloat(cs.opacity||'1')>0}
function checkSuccess(){
 if(completeHandled)return;
 var doc;
 try{doc=game.contentDocument||game.contentWindow.document}catch(e){return}
 if(!doc||!visible(doc,current.overlay))return;
 var title=doc.getElementById(current.title);if(!title)return;
 var txt=(title.textContent||title.innerText||'').replace(/^\s+|\s+$/g,'');
 if(txt.indexOf(current.success)===-1)return;
 completeHandled=true;if(pollTimer)clearInterval(pollTimer);
 var detail=doc.getElementById(current.detail),detailText=detail?(detail.textContent||detail.innerText||''):'';
 state=safeRead()||{startedAt:Date.now(),results:{}};if(!state.results)state.results={};
 state.results[current.id]={seconds:Math.max(1,Math.round((Date.now()-missionStarted)/1000)),detail:detailText};safeWrite(state);
 showTransition();
}
function showTransition(){
 document.getElementById('done-kicker').innerHTML='МИССИЯ '+(step+1)+' ИЗ 4 ВЫПОЛНЕНА';
 document.getElementById('done-title').innerHTML=current.name;
 var last=step===3;document.getElementById('next-btn').innerHTML=last?'ПОКАЗАТЬ ИТОГ':'СЛЕДУЮЩАЯ МИССИЯ';document.getElementById('auto-note').innerHTML=last?'Финальный экран откроется автоматически':'Автопереход через 4 секунды';
 transition.className='transition active';
 if(autoTimer)clearTimeout(autoTimer);autoTimer=setTimeout(next,4000);
}
function next(){if(autoTimer){clearTimeout(autoTimer);autoTimer=null}if(step>=3){location.href='./?complete=1';return}location.href='campaign.html?step='+(step+1)}
document.getElementById('next-btn').onclick=next;
game.onload=function(){missionStarted=Date.now()};
load();
})();
</script>
</body>
</html>
