name: MP-04 orbit iPad compatibility

on:
  push:
    branches: ["feature/mission-orbit"]
    paths:
      - "missions/orbit/**"
      - "tests/orbit-ipad.spec.js"
      - ".github/workflows/orbit-ipad.yml"
  workflow_dispatch:

jobs:
  ipad-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/orbit-ipad.spec.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-ipad-test-artifacts
          path: test-results/
          if-no-files-found: ignore
