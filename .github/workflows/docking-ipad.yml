name: Docking mission iPad compatibility

on:
  push:
    branches: ["feature/mission-docking"]
    paths:
      - "missions/docking/**"
      - "tests/docking-ipad.spec.js"
      - "playwright.config.js"
      - "package.json"
      - ".github/workflows/docking-ipad.yml"
  workflow_dispatch:

jobs:
  ipad-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/docking-ipad.spec.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docking-ipad-test-artifacts
          path: test-results/
          if-no-files-found: ignore
