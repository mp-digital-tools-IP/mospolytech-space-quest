name: Final hub iPad compatibility

on:
  push:
    branches: ["feature/final-hub"]
    paths:
      - "index.html"
      - "campaign.html"
      - "tests/ipad.spec.js"
      - ".github/workflows/hub-ipad.yml"
  workflow_dispatch:

jobs:
  ipad-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/ipad.spec.js
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-hub-test-artifacts
          path: test-results/
          if-no-files-found: ignore
